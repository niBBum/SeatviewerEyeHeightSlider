<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeatViewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d0e;--p:#141718;--p2:#1a1e1f;--ln:#2a3031;--tx:#f5f6f1;--mu:#a2aaa7;--ac:#d5fa43;--on:#13170a;--bad:#e5645a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}svg{flex:none}
h1,h2,h3,p{margin:0}.wrap{max-width:1440px;margin:0 auto;padding:0 56px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);font-weight:600;font-size:14px;transition:.12s}
.btn:hover{border-color:#4a5253;background:#222829}.btn.pr{background:var(--ac);color:var(--on);border-color:var(--ac)}.btn.pr:hover{filter:brightness(1.07)}
.btn.lg{height:54px;font-size:16px;padding:0 26px}.btn.w{width:100%}.btn.sm{height:34px;font-size:13px;padding:0 12px}.btn.gh{background:none;border-color:transparent;color:var(--mu)}.btn:disabled{opacity:.4;cursor:default}
.eb{display:flex;align-items:center;gap:12px;color:var(--ac);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.eb:before{content:"";width:28px;height:2px;background:var(--ac)}.eb.n:before{display:none}
.ic.fl{transform:scaleX(-1)}.mu{color:var(--mu)}.ac{color:var(--ac)}.sm{font-size:13px}.xs{font-size:12px}
/* header */
.hd{position:sticky;top:0;z-index:30;background:rgba(11,13,14,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.hr{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}.lg-i{width:30px;height:30px;border-radius:8px;background:var(--ac);color:var(--on);display:grid;place-items:center}
.nv{display:flex;gap:30px}.nv a{color:var(--mu);font-size:14px;font-weight:500;padding:6px 0}.nv a:hover,.nv a.on{color:var(--tx)}.nv a.on.g{color:var(--ac)}
.rt{display:flex;align-items:center;gap:14px}.loc{background:none;border:0;color:var(--mu);display:flex;gap:8px;align-items:center;font-size:14px}
.steps{border-bottom:1px solid var(--ln)}.sr{display:flex;align-items:center;justify-content:space-between;height:66px}.sl{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:14px;background:none;border:0}
.stp{display:flex;align-items:center;gap:14px}.stp button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mu);font-size:13px;font-weight:500;padding:0}.stp b{width:26px;height:26px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font-size:11px}.stp .on{color:var(--tx);font-weight:600}.stp .on b{background:var(--ac);color:var(--on)}.stp .dn b{color:var(--ac)}.stp hr{width:40px;border:0;border-top:1px solid var(--ln);margin:0}
.ft{border-top:1px solid var(--ln);margin-top:56px;padding:26px 0;color:var(--mu);font-size:13px}.ft .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.ft nav{display:flex;gap:26px}.ft a,.ft button{background:none;border:0;color:inherit;padding:0;font-size:13px}.ft a:hover,.ft button:hover{color:var(--tx)}
.note{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:13px;margin-top:26px}
/* home */
.home{min-height:100vh;background:radial-gradient(1100px 700px at 95% -10%,rgba(120,160,130,.5),transparent 60%),radial-gradient(600px 500px at 80% 60%,rgba(60,90,70,.25),transparent 70%),#080a0a}
.hm{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center;padding:64px 0 40px}
.hm h1{font-size:clamp(52px,7vw,92px);line-height:.98;letter-spacing:-.045em;font-weight:700;margin:26px 0}.hm .lead{font-size:19px;color:var(--mu);max-width:470px;margin-bottom:34px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:16px}.samp{padding:14px;background:rgba(20,23,24,.9);border-radius:18px}
.vw{position:relative;overflow:hidden;border-radius:10px;background:#000;touch-action:none;cursor:grab;aspect-ratio:2.3/1;user-select:none}.vw:active{cursor:grabbing}.vw img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:filter .3s}.vw.dim img{filter:brightness(.62) saturate(.8)}
.bdg{position:absolute;left:12px;top:12px;background:rgba(8,10,10,.78);padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.06em;display:flex;gap:6px;align-items:center}.bdg .ic{color:var(--ac);width:13px;height:13px}
.fsb{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:6px;background:rgba(8,10,10,.78);border:0;display:grid;place-items:center}
.tg{position:absolute;left:12px;bottom:12px;background:rgba(8,10,10,.78);padding:5px 10px;border-radius:6px;font-size:11px;display:flex;gap:7px;align-items:center}.tg i{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stt b{display:block;font-size:19px;font-weight:600}.stt span{font-size:12px;color:var(--mu)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.three>div{display:flex;gap:14px;padding:18px;background:rgba(20,23,24,.6);border-radius:10px}.num{width:32px;height:32px;border-radius:8px;background:rgba(213,250,67,.15);color:var(--ac);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
/* discover/browse */
.hero-t{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;padding:44px 0 30px}.hero-t h1,.pg h1{font-size:clamp(38px,4.8vw,64px);letter-spacing:-.035em;line-height:1.04;font-weight:600;margin-top:10px}
.spot{position:relative;border-radius:16px;overflow:hidden;min-height:360px;display:flex;align-items:flex-end;background:#000 center/cover;border:1px solid var(--ln)}.spot:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,10,.92),rgba(8,10,10,.1) 60%),linear-gradient(0deg,rgba(8,10,10,.7),transparent 50%)}
.spot>div{position:relative;display:flex;justify-content:space-between;align-items:flex-end;width:100%;padding:36px 40px;gap:20px}.spot h2{font-size:clamp(56px,8vw,104px);letter-spacing:-.04em;line-height:1;font-weight:700}
.srch{display:flex;align-items:stretch;gap:0;background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:8px;margin:20px 0 44px}.srch label{display:block;flex:1;padding:6px 20px;border-right:1px solid var(--ln);font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em}.srch label:last-of-type{border:0}
.srch input,.srch select,.sel{width:100%;background:none;border:0;color:var(--tx);font:500 15px Inter,sans-serif;outline:none;padding:2px 0;text-transform:none;letter-spacing:0}select option{background:#141718}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.sh h2{font-size:32px;letter-spacing:-.02em;font-weight:600;margin-top:8px}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.chip{height:36px;padding:0 16px;border-radius:99px;border:1px solid var(--ln);background:var(--p);font-size:13px;color:var(--mu)}.chip:hover{color:var(--tx)}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:22px}
.cc{background:var(--p);border:1px solid var(--ln);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}.cc:hover{border-color:#566;transform:translateY(-2px)}
.ci{position:relative;aspect-ratio:1.62;background:#000}.ci img{width:100%;height:100%;object-fit:cover;display:block}
.dt{position:absolute;left:10px;top:10px;background:rgba(8,10,10,.85);border-radius:8px;padding:5px 10px;text-align:center;line-height:1.1}.dt small{display:block;font-size:10px;color:var(--mu);letter-spacing:.06em}.dt b{font-size:22px}
.bm{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:8px;background:rgba(8,10,10,.85);border:0;display:grid;place-items:center}.bm.on{color:var(--ac)}.bm.on .ic{fill:var(--ac)}
.pill{position:absolute;left:10px;bottom:10px;background:rgba(8,10,10,.85);border-radius:99px;padding:5px 10px;font-size:11px;display:flex;gap:6px;align-items:center}.pill .ic{color:var(--ac);width:12px;height:12px}
.cb{padding:16px}.cb .r1{display:flex;justify-content:space-between;font-size:12px}.cb h3{font-size:22px;margin-top:8px;font-weight:600;letter-spacing:-.01em}.cb .v{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mu);margin-top:8px}.cb .v .ic{width:12px;height:12px}
.cf{display:flex;justify-content:space-between;border-top:1px solid var(--ln);margin-top:14px;padding-top:12px;font-size:14px}.cf span:last-child{color:var(--ac);font-weight:600;display:flex;gap:6px;align-items:center}
.how{background:var(--p);border-block:1px solid var(--ln);margin-top:70px;padding:60px 0}.how .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:34px}.how .ico{width:42px;height:42px;border-radius:10px;background:rgba(213,250,67,.13);color:var(--ac);display:grid;place-items:center;margin-bottom:22px}.how h3{font-size:20px;font-weight:500;margin-bottom:8px}
.news{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:36px 0;flex-wrap:wrap}.news form{display:flex;gap:14px;flex:1;max-width:620px}
.inp{height:48px;border-radius:8px;border:1px solid var(--ln);background:var(--p);color:var(--tx);padding:0 16px;font:inherit;outline:none;width:100%;transition:.12s}.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(213,250,67,.15)}.inp.bad{border-color:var(--bad)}.inp::placeholder{color:#69736f}
.fbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:30px 0 22px}.fbar>div{flex:1;min-width:150px}.fbar label,.fl{display:block;font-size:12px;color:var(--mu);margin-bottom:6px;font-weight:500}.fbar .inp{background:var(--bg)}.fbar select.inp{appearance:none;background-image:none}
.tgl{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mu);background:none;border:0}.tgl i{width:36px;height:20px;border-radius:99px;background:#3a4140;position:relative;transition:.15s}.tgl i:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--tx);transition:.15s}.tgl.on i{background:var(--ac)}.tgl.on i:after{left:19px;background:var(--on)}
.pg2{display:flex;justify-content:space-between;align-items:center;margin-top:28px;color:var(--mu);font-size:13px}.pn{display:flex;gap:8px;align-items:center}.pn button{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--p2)}.pn button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--mu)}
/* choose */
.pg{padding-top:34px}.pgh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.pgh h1{font-size:clamp(34px,4vw,50px)}
.lay{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);gap:10px;flex-wrap:wrap}.mh select{height:38px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);padding:0 12px;font:500 14px Inter,sans-serif}
.map{position:relative;background:var(--bg)}.map svg{display:block;width:100%;height:auto}
.sd{fill:#8e9893;cursor:pointer}.sd.un{fill:#363c3d;cursor:not-allowed}.sd.dm{opacity:.2}.sd.sel{fill:var(--ac)}.sd.act{fill:#c5cec8}.sd.un.act{fill:#363c3d}
.lbl{fill:var(--mu);font-size:13px;font-weight:500;pointer-events:none}.lbl.hi{fill:var(--ac);font-weight:600}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:rgba(213,250,67,.05)}
.zm{position:absolute;right:20px;bottom:18px;display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:8px;overflow:hidden}.zm button{width:40px;height:38px;border:0;background:none;font-size:20px}.zm button:hover{background:#262c2d}
.cl{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:20px 24px;background:#131617;border-top:1px solid var(--ln)}.cg{display:grid;gap:7px;justify-content:start;align-items:center}.cg .n{font-size:10px;color:var(--mu);text-align:center}.cg .rl{font-size:11px;color:var(--mu);width:14px}
.st{width:26px;height:22px;border-radius:5px;border:0;background:#8e9893;padding:0;display:grid;place-items:center;color:var(--on)}.st.un{background:#2e3435;cursor:not-allowed}.st.sel{background:var(--ac)}.st:not(.un):hover{filter:brightness(1.2)}
.lg2{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--ln);font-size:12px;color:var(--mu)}.lg2 span{display:inline-flex;align-items:center;gap:6px;margin-right:16px}.lg2 i{width:10px;height:10px;border-radius:2px;display:inline-block}
.sp{padding:20px;margin-bottom:16px}.sp .tp{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.07em;color:var(--mu);text-transform:uppercase}.av{background:rgba(213,250,67,.12);color:var(--ac);border-radius:99px;padding:3px 10px;font-size:12px;letter-spacing:0;text-transform:none;font-weight:500}.av.no{background:rgba(229,100,90,.15);color:var(--bad)}
.sn{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}.sn h3{display:flex;gap:12px;align-items:center;font-size:23px;font-weight:600;letter-spacing:-.01em}.sn b.pr{font-size:30px;font-weight:600;letter-spacing:-.02em}
.ab{width:28px;height:28px;border-radius:7px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}.ab.o{background:none;color:var(--tx);border:1.5px solid var(--mu)}
.ck{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:13px;margin:14px 0}.ck .ic{color:var(--ac)}.hl{border-top:1px solid var(--ln);margin:14px 0}
.alt{padding:18px 20px}
/* view */
.tabs{display:flex;gap:18px;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--ln);align-items:center}.tabs button{background:none;border:0;color:var(--mu);display:flex;gap:8px;align-items:center;padding:0;font-weight:500}.tabs .on{color:var(--ac)}
.vb{padding:0 16px 16px}.vb .vw{margin-top:0;aspect-ratio:2.05/1;border-radius:0 0 10px 10px}
.ctl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(14,17,18,.9);border:1px solid var(--ln);border-radius:99px;padding:4px 6px;font-size:13px;z-index:3}.ctl button{width:32px;height:32px;border:0;background:none;border-radius:50%;font-size:18px}.ctl button:hover{background:#262c2d}.ctl span{padding:0 10px}.ctl .z{min-width:40px;text-align:center;padding:0;color:var(--mu)}
.cap{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:12px}.cap span{display:flex;gap:8px;align-items:center}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.k3>div{padding:18px 20px}.k3 small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}.k3 b{display:block;font-size:26px;font-weight:500;margin:8px 0 4px}
.cmpb{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:24px;padding:20px 24px;border-radius:12px;background:#1f2a12;border:1px solid #3a4a1c}.cmpb h3{font-size:18px;font-weight:500}
.mini{background:var(--bg);border-radius:10px;margin:12px 0}.mini svg{display:block;width:100%}
/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px}.cp{padding:20px}.cp.a{border-color:#5d6d28}.cp .vw{aspect-ratio:2.05/1;margin:16px -20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--ln);font-size:14px;color:var(--mu)}.row b{color:var(--tx);font-weight:500}.row em{font-style:normal;font-size:12px;margin-right:16px}
.tag{background:rgba(213,250,67,.15);color:var(--ac);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.trade{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 24px;margin-top:20px;border-radius:12px;background:var(--p);border:1px solid var(--ln)}.trade .bl{width:40px;height:40px;border-radius:10px;background:rgba(213,250,67,.13);color:var(--ac);display:grid;place-items:center}
.tabh{display:flex;gap:12px;align-items:baseline;padding:14px 18px;margin-bottom:-1px;background:var(--p);border:1px solid var(--ln);border-bottom:2px solid var(--ac);border-radius:10px 10px 0 0;font-size:15px}.tabh.B{border-bottom-color:#5fc8ff}.tabh .mu{font:12px 'JetBrains Mono',ui-monospace,monospace}
.tabh+.cp{border-top-left-radius:0;border-top-right-radius:0}.tabh.B+.cp{border-color:#2f5d73}
.vs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;margin-bottom:16px;border:1px solid var(--ln);border-radius:12px;background:var(--p);font-size:14px}.vs .eb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-right:6px}.vs span:not(.eb){padding:6px 12px;border-radius:99px;background:var(--p2)}
.cmpt{border:1px dashed #5fc8ff;color:#5fc8ff;background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}.cmpt:hover{background:rgba(95,200,255,.1)}
.pk .cl{grid-template-columns:1fr}.pk .cg{max-width:100%}
/* saved */
.sv{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:10px}.sv .vi{display:grid;grid-template-columns:1fr 1fr}.sv .vi img{width:100%;aspect-ratio:1.6;object-fit:cover;display:block}
/* auth */
.au{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.al{display:flex;flex-direction:column;padding:32px 64px;max-width:760px;margin-left:auto;width:100%}.al .bar{display:flex;justify-content:space-between;align-items:center}.afm{margin:auto 0;max-width:392px;width:100%;margin-inline:auto;padding:30px 0}
.afm h1{font-size:44px;line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:18px 0 14px}.afm form>div{margin-bottom:18px}.afm label.fl{color:var(--tx)}
.pw{position:relative}.pw .inp{padding-right:70px}.pw button{position:absolute;right:14px;top:0;height:100%;background:none;border:0;color:var(--mu);font-weight:600;font-size:13px}
.er{color:var(--bad);font-size:13px;margin:-4px 0 14px;display:none}.er.on{display:block}.sep{display:flex;gap:16px;align-items:center;color:var(--mu);font-size:13px;margin:22px 0}.sep:before,.sep:after{content:"";flex:1;border-top:1px solid var(--ln)}
.ar{margin:16px;border-radius:24px;overflow:hidden;position:relative;border:1px solid var(--ln);background:radial-gradient(500px 800px at 70% -5%,rgba(160,190,165,.75),transparent 70%),linear-gradient(160deg,#16201c,#0b100e);display:flex;flex-direction:column;justify-content:space-between;padding:32px 36px}.ar h2{font-size:clamp(38px,4vw,58px);letter-spacing:-.04em;line-height:1;font-weight:700;margin-bottom:24px}
.ar .mc{background:rgba(8,12,10,.75);border:1px solid var(--ln);border-radius:14px;padding:18px}.ar .mc+.mc{margin-top:12px}
.cbx{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mu);margin-bottom:18px}.cbx input{accent-color:var(--ac);width:18px;height:18px;margin:2px 0 0}.cbx a,.lk{color:var(--ac);font-weight:600;background:none;border:0;padding:0}
/* ui */
dialog{background:var(--p);color:var(--tx);border:1px solid var(--ln);border-radius:16px;padding:28px;max-width:520px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(0,0,0,.65)}dialog h2{font-size:24px;margin-bottom:14px;letter-spacing:-.02em}dialog p{color:var(--mu);margin-bottom:12px}dialog .x{position:absolute;right:14px;top:14px;background:none;border:0;font-size:22px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:99;background:var(--ac);color:var(--on);padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;transition:.2s;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
.od{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}
@media(max-width:1000px){.wrap{padding:0 20px}.nv,.stp{display:none}.hm,.lay,.cmp,.au,.cl{grid-template-columns:1fr}.grid4,.sv{grid-template-columns:repeat(2,1fr)}.three,.how .g3,.k3{grid-template-columns:1fr}.ar{display:none}.al{padding:24px 20px}.srch{flex-direction:column}.srch label{border:0;border-bottom:1px solid var(--ln)}.hero-t,.news,.cmpb,.trade,.spot>div{flex-direction:column;align-items:flex-start}.sh{flex-direction:column;align-items:flex-start;gap:10px}.news form{max-width:none;width:100%}}
@media(max-width:560px){.grid4,.sv{grid-template-columns:1fr}.st{width:19px}}
.vw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.vw canvas:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}.vw:fullscreen{aspect-ratio:auto;border-radius:0;width:100%;height:100%}.vw:-webkit-full-screen{aspect-ratio:auto;border-radius:0;width:100%;height:100%}
.eye{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:14px;font-size:13px;color:var(--mu)}.eye label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--tx);white-space:nowrap}.eye label .ic{color:var(--ac);width:15px;height:15px}.eye input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--ac);cursor:pointer}.eye output{min-width:5ch;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}.eye .btn[aria-pressed=true]{border-color:var(--ac);color:var(--ac)}.eye.bar{padding:12px 16px;margin:0 0 16px;border:1px solid var(--ln);border-radius:12px;background:var(--p)}

function floorSeat(xm,r){
  build3D();var best=null,bc=1e9;

    var c=(s.x-xm)*(s.x-xm)+Math.pow((s.r-r)*3,2);if(c<bc){bc=c;best=s;}}
  return best;
}

  build3D();var best=null,bc=1e9;

}
